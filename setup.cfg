[metadata]
name = benefitradar
version = 0.1.0
description = 복지로 API 기반 정부 복지 정보 수집 및 분석
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/<username>/BenefitRadar
license = MIT
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages = find:
python_requires = >=3.11
install_requires =
    requests>=2.32.0
    beautifulsoup4>=4.12.3
    pyyaml>=6.0.1
    jinja2>=3.1.3
    feedparser>=6.0.10
    python-dateutil>=2.8.0
    pydantic>=2.5.0
    duckdb>=0.9.0
    tenacity>=8.2.0
    structlog>=24.2.0
    mcp>=1.0.0
    pybreaker>=1.0.0
    radar-core @ git+https://github.com/ai-frendly-datahub/radar-core.git@81108dd689b7966d613b32a48ec3a1c60d1cd542

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    mypy>=1.5.0
    black>=23.0.0
    ruff>=0.1.0
    types-PyYAML
    types-requests
    types-python-dateutil

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    *.egg-info
